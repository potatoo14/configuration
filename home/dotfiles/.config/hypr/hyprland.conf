#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#

# See https://wiki.hyprland.org/Configuring/Keywords/
# basically caps lock as another mod key
$HYPER = MOD3
 
# Source a file (multi-file configs)
# source = ~/.config/hypr/wallpaper.conf
source = ~/.config/hypr/local.conf

# See https://wiki.hyprland.org/Configuring/Monitors/
# monitor=,preferred,auto,0.66666666667 # two thirds
monitor=,preferred,auto,1

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
# Tells systemd about the Wayland environment so user services can interact with the display
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_RUNTIME_DIR
exec-once = uwsm app -- swaync
exec-once = uwsm app -- vicinae server
exec-once = uwsm app -- waybar
exec-once = uwsm app -- fcitx5
exec-once = uwsm app -- easyeffects --gapplication-service
# exec-once = eval "$(ssh-agent -s)"
# exec-once = swayosd-server
# exec-once = systemctl --user start hyprpolkitagent

# Some env vars
# env = SDL_VIDEODRIVER, wayland # a lot of games don't like this
# env = MANGOHUD, 1 # sometimes shows up in not games
env = XDG_CURRENT_DESKTOP, Hyprland
env = QT_QPA_PLATFORMTHEME, qt5ct # for qt5ct and qt6ct
env = DXVK_CONFIG_FILE, /home/user/.config/dxvk.conf
env = BROWSER, firefox
env = GDK_BACKEND, wayland,x11,*
env = QT_QPA_PLATFORM, wayland;xcb

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 0
    gaps_out = 0
    border_size = 0
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = true
}
decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 10
    
    blur {
        enabled = yes
        size = 4
        passes = 1
    }

    shadow {
        enabled = yes
        range = 2
        render_power = 1
        color = rgba(1a1a1aaa)
    }
}
animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = sharp, 0, 0.9, 0, 1.0

    animation = windows, 1, 4, sharp
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 7, default
    animation = borderangle, 1, 6, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 3, default
    animation = specialWorkspace, 1, 4, sharp, slidevert
}
dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling.
    preserve_split = yes # you probably want this
    # smart_split = yes
}
# gestures {
#     # See https://wiki.hyprland.org/Configuring/Variables/ for more
#     workspace_swipe = off
# }
misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers (just in case)
    # animate_manual_resizes = yes # "physics based" window resizing
    disable_hyprland_logo = yes # black screen on the bottom layer
    enable_anr_dialog = no # disable the application not responding thing
}
input {
    # switchable-keyboard-layouts https://wiki.hyprland.org/Configuring/Uncommon-tips--tricks
    # using fcitx5 instead
    # kb_layout = us,us
    # kb_variant = ,intl
    # kb_model =
    kb_options = caps:hyper
    # kb_rules =

    follow_mouse = 1

    repeat_delay = 160
    repeat_rate = 120

    touchpad {
        # tap-to-click = off
        disable_while_typing = false
    }
}
# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = roccat-roccat-savu-1
    sensitivity = -0.79 # -1.0 to 1.0, 0 means no modification.
}
device { # same device 2 times, idk why it my mouse does that
    name = roccat-roccat-savu-2
    sensitivity = -0.79 # -1.0 to 1.0, 0 means no modification.
}
render {
    # direct_scanout = yes # tries to reduce input lag on fullscreen apps
}
cursor {
    no_hardware_cursors = no
}
ecosystem {
    no_update_news = true;
    no_donation_nag = true;
}

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more

# launch apps
bind = SUPER, s, exec, uwsm app -- foot
bind = SUPER, a, exec, uwsm app -- foot btop
bind = SUPER, e, exec, uwsm app -- foot yazi
bind = SUPER, f, exec, uwsm app -- firefox
bind = SUPER, c, exec, uwsm app -- qalculate-gtk
bind = SUPER, d, exec, uwsm app -- easyeffects
bind = SUPER, w, exec, uwsm app -- vicinae toggle
bind = SUPER, t, exec, uwsm app -- transmission-gtk

# window things
bind = SUPER, q, killactive,
bind = SUPER, grave, fullscreen,
bind = $HYPER, grave, togglefloating,
bind = SUPER, tab, layoutmsg, togglesplit
bind = $HYPER, tab, pseudo, # dwindle

# Change focus
bind = SUPER, h, movefocus, l
bind = SUPER, l, movefocus, r
bind = SUPER, k, movefocus, u
bind = SUPER, j, movefocus, d

# Move windows around
bind = SUPER SHIFT, h, movewindow, l
bind = SUPER SHIFT, l, movewindow, r
bind = SUPER SHIFT, k, movewindow, u
bind = SUPER SHIFT, j, movewindow, d

# Resize windows
bind = SUPER CONTROL, h, resizeactive, -50 0
bind = SUPER CONTROL, l, resizeactive, 50 0
bind = SUPER CONTROL, k, resizeactive, 0 -50
bind = SUPER CONTROL, j, resizeactive, 0 50

# Switch workspaces with mod + [0-9]
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move active window to a workspace with mod + SHIFT + [0-9]
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10
bind = SUPER SHIFT, x, movetoworkspace, r+1
bind = SUPER SHIFT, z, movetoworkspace, r-1

# Example special workspace (scratchpad)
# bind = SUPER, z, togglespecialworkspace, magic
# bind = SUPER SHIFT, z, movetoworkspace, special:magic
bind = SUPER, d, togglespecialworkspace, sound

# Scroll through workspaces
bind = SUPER, mouse_up, workspace, r+1
bind = SUPER, mouse_down, workspace, r-1
bind = SUPER, x, workspace, r+1
bind = SUPER, z, workspace, r-1

# Drag window across workspaces
bind = SUPER SHIFT, mouse_up, movetoworkspace, r+1
bind = SUPER SHIFT, mouse_down, movetoworkspace, r-1

# Move/resize windows with mod + LMB/RMB and dragging
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# media keys
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioNext, exec, playerctl next
bind = $HYPER, 1, exec, playerctl play-pause
bind = $HYPER, 2, exec, playerctl previous
bind = $HYPER, 3, exec, playerctl next

bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = $HYPER, f, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bind = , XF86AudioRaiseVolume, exec, ~/.config/hypr/volume.sh +
bind = , XF86AudioLowerVolume, exec, ~/.config/hypr/volume.sh -
bind = $HYPER, d, exec, ~/.config/hypr/volume.sh +
bind = $HYPER, s, exec, ~/.config/hypr/volume.sh -

# switch between keyboard layouts, in an nice way
bind = $HYPER, q, exec, if [[ $(fcitx5-remote -n) = "mozc" ]]; then fcitx5-remote -s keyboard-us; else fcitx5-remote -s mozc; fi
bind = $HYPER, a, exec, if [[ $(fcitx5-remote -n) = "keyboard-us-intl" ]]; then fcitx5-remote -s keyboard-us; else fcitx5-remote -s keyboard-us-intl; fi

# screenshot stuff
$shaderOff = hyprctl keyword decoration:screen_shader ""
$shaderOn = hyprctl keyword decoration:screen_shader ~/.config/hypr/blue-light-filter.glsl
bind = SHIFT, print, exec, $shaderOff; grim ~/Archive/$(date +%y-%m-%d_%H-%M.png); $shaderOn
bind = , print, exec, $shaderOff; grim -g "$(slurp -b 110F0D77)" ~/Archive/$(date +%y-%m-%d_%H-%M.png); $shaderOn

# shader stuff
decoration:screen_shader = ~/.config/hypr/blue-light-filter.glsl
bind = $HYPER, x, exec, ~/.config/hypr/shader.py +
bind = $HYPER, z, exec, ~/.config/hypr/shader.py -

# sed it wierd af
# bind = SHIFT, code:66, exec hyprctl keyword dwindle:smart_split $(awk "{1-$(hyprctl getoption dwindle:smart_split|grep int:|sed s/int://)}")
 
bind = SUPER $HYPER, q, exec, hyprpicker -a

# restart waybar, and reload hyprland
bind = SUPER ALT, s, exec, pkill waybar; hyprctl dispatch exec 'uwsm app -- waybar'; hyprctl reload

# kill waybar, idk why fullscreen games are usually borked, running the in a window instead
bind = SUPER ALT, a, exec, pkill waybar

# change mouse profile
bind = SUPER ALT, z, exec, roccatsavucontrol -a 1
bind = SUPER ALT, x, exec, roccatsavucontrol -a 2
 
# toggle increased gamma
# https://github.com/mischw/wl-gammactl/issues/9
# bind = SUPER ALT, c, exec, [[ $(pgrep wl-gammactl) ]] && pkill wl-gammactl || wl-gammactl -g 1.2

# window rules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# everything is relative to the top left corner of the window and screen,
# ((screen_size/2)-(window_size/2))/screen_size*100 to center stuff horizontally or vertically
# use hyprctl clients to figure out window sizes
windowrule = match:class qalculate-gtk, float on
windowrule = match:class qalculate-gtk, center on
windowrule = match:class qalculate-gtk, size 90 50

windowrule = match:class com.github.wwmm.easyeffects, float on
windowrule = match:class com.github.wwmm.easyeffects, center on
windowrule = match:class com.github.wwmm.easyeffects, workspace special:sound
windowrule = match:class com.github.wwmm.easyeffects, size 1000 800

windowrule = match:title Transmission, float on
windowrule = match:title Transmission, center on
windowrule = match:title Transmission, size 800 600

# windowrule = float, title:Picture-in-Picture
# windowrule = pin, title:Picture-in-Picture
# windowrule = size 35% 35%, title:Picture-in-Picture
# windowrule = move 65% 0%, title:Picture-in-Picture

# tearing
windowrule = match:class osu!, immediate yes
windowrule = match:class MuseDash, immediate yes

# layerrule = blur,vicinae
# layerrule = ignorealpha 0, vicinae

# windowrule = match:class foot, opacity 0.9

# layerrule = noanim, swayosd
